<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenix Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

.chat-container{
  width:100%;
  max-width:420px;
  height:95vh;
  display:flex;
  flex-direction:column;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.chat-header{
  background:#111b21;
  color:white;
  padding:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#00a884,#008069);
}

/* CHAT AREA */
.chat-box{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:url('https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg');
  background-size:cover;
  background-position:center;
  scroll-behavior:smooth;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* MESSAGE */
.message{
  max-width:75%;
  padding:8px 12px 6px 12px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
  animation:slideIn .25s ease;
  backdrop-filter: blur(1px);
}

.sent{
  align-self:flex-end;
  background:#0f6a57;
  color:white;
  border-bottom-right-radius:4px;
}

/* META */
.meta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  font-size:11px;
  margin-top:4px;
  opacity:.85;
}

.check{
  transition:.3s;
}

/* IMAGE FIX */
.chat-img{
  max-width:220px;
  border-radius:12px;
  display:block;
  border:1px solid rgba(255,255,255,0.08);
  margin-bottom:4px;
}

/* INPUT TELEGRAM STYLE */
.chat-input{
  background:#0f0f0f;
  padding:10px;
}

.input-wrapper{
  background:#1c1c1c;
  border-radius:30px;
  display:flex;
  align-items:center;
  padding:6px 14px;
  gap:12px;
}

.input-wrapper input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:15px;
}

/* ICON STYLE */
.icon-btn{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:.9;
  transition:.2s;
}

.icon-btn:hover{
  transform:scale(1.1);
}

.icon-btn svg{
  fill:#4fc3f7;
  width:22px;
  height:22px;
}

.send-btn{
  background:#4fc3f7;
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.send-btn:hover{
  transform:scale(1.08);
}

.send-btn svg{
  fill:white;
  width:20px;
}

/* EMOJI PANEL */
.emoji-panel{
  display:none;
  background:#111;
  padding:8px;
  font-size:22px;
  flex-wrap:wrap;
  gap:10px;
}

.emoji-panel span{
  cursor:pointer;
  margin:5px;
  transition:.2s;
}

.emoji-panel span:hover{
  transform:scale(1.2);
}

/* ANIMATION */
@keyframes slideIn{
  from{opacity:0;transform:translateX(20px);}
  to{opacity:1;transform:translateX(0);}
}
</style>
</head>
<body>

<div class="chat-container">

<div class="chat-header">
<div class="avatar"></div>
ZenixStore
</div>

<div class="chat-box" id="chatBox"></div>

<div class="emoji-panel" id="emojiPanel">
<span>😂</span>
<span>❤️</span>
<span>🔥</span>
<span>👍</span>
<span>😎</span>
<span>😭</span>
<span>😡</span>
</div>

<div class="chat-input">
<div class="input-wrapper">

<div class="icon-btn" onclick="toggleEmoji()">
<svg viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20zm-4-8c1.5 2 6.5 2 8 0"/></svg>
</div>

<input type="text" id="messageInput" placeholder="Message">

<input type="file" id="imageInput" accept="image/*" hidden>

<div class="icon-btn" onclick="openGallery()">
<svg viewBox="0 0 24 24"><path d="M16 7l-1.4-1.4a2 2 0 0 0-2.8 0L3 14.4V21h6.6l8.8-8.8a2 2 0 0 0 0-2.8L16 7z"/></svg>
</div>

<div class="send-btn" onclick="sendMessage()">
<svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
</div>

</div>
</div>

</div>

<script>
const chatBox=document.getElementById("chatBox");
const messageInput=document.getElementById("messageInput");
const emojiPanel=document.getElementById("emojiPanel");
const imageInput=document.getElementById("imageInput");

function getTime(){
const now=new Date();
return now.getHours().toString().padStart(2,'0')+":"+
now.getMinutes().toString().padStart(2,'0');
}

function toggleEmoji(){
emojiPanel.style.display=
emojiPanel.style.display==="flex"?"none":"flex";
}

emojiPanel.querySelectorAll("span").forEach(e=>{
e.onclick=()=>messageInput.value+=e.textContent;
});

function applyReadEffect(checkEl){
setTimeout(()=>{checkEl.innerHTML="✓✓";},800);
setTimeout(()=>{checkEl.style.color="#4fc3f7";},1500);
}

function createMeta(){
const meta=document.createElement("div");
meta.className="meta";
const time=document.createElement("span");
time.textContent=getTime();
const check=document.createElement("span");
check.className="check";
check.textContent="✓";
meta.appendChild(time);
meta.appendChild(check);
applyReadEffect(check);
return meta;
}

function sendMessage(){
const text=messageInput.value.trim();
if(text==="")return;

const msg=document.createElement("div");
msg.className="message sent";
msg.innerHTML=text;
msg.appendChild(createMeta());

chatBox.appendChild(msg);
chatBox.scrollTop=chatBox.scrollHeight;
messageInput.value="";
emojiPanel.style.display="none";
}

function openGallery(){imageInput.click();}

imageInput.addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(e){
const msg=document.createElement("div");
msg.className="message sent";
const img=document.createElement("img");
img.src=e.target.result;
img.className="chat-img";
msg.appendChild(img);
msg.appendChild(createMeta());
chatBox.appendChild(msg);
chatBox.scrollTop=chatBox.scrollHeight;
};
reader.readAsDataURL(file);
});

messageInput.addEventListener("keypress",e=>{
if(e.key==="Enter")sendMessage();
});
</script>

</body>
</html>
