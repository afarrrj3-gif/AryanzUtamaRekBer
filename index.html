<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Chat System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter',-apple-system,BlinkMacSystemFont;
background:url('https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg');
background-size:cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:430px;
height:100vh;
display:flex;
flex-direction:column;
backdrop-filter:blur(18px);
}

.header{
padding:14px;
font-weight:600;
color:white;
background:#0f1720;
}

.chat{
flex:1;
overflow-y:auto;
padding:12px;
scroll-behavior:smooth;
}

.message{
display:flex;
margin:6px 0;
animation:fade .15s ease;
}

.me{justify-content:flex-end}
.other{justify-content:flex-start}

.bubble{
position:relative;
background:#1f2c39;
color:white;
padding:8px 10px;
border-radius:14px;
max-width:75%;
font-size:15px;
line-height:1.4;
word-wrap:break-word;
}

.me .bubble{
background:#2b6cb0;
border-bottom-right-radius:5px;
}

.other .bubble{
border-bottom-left-radius:5px;
}

.meta{
font-size:11px;
opacity:.8;
display:flex;
align-items:center;
gap:4px;
margin-top:3px;
justify-content:flex-end;
}

.inline{
display:inline-flex;
align-items:center;
gap:4px;
margin-left:6px;
font-size:11px;
opacity:.8;
}

.check{
color:#3ba4ff;
}

img.chat-img{
max-width:100%;
border-radius:6px;
display:block;
}

.input-area{
display:flex;
align-items:center;
padding:8px;
background:#0f1720;
gap:8px;
}

.icon-btn{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
cursor:pointer;
color:white;
}

input{
flex:1;
background:#1f2c39;
border:none;
outline:none;
color:white;
padding:10px 14px;
border-radius:20px;
font-size:14px;
}

.send{
background:#2b6cb0;
width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
cursor:pointer;
}

.context{
position:absolute;
background:#1c2733;
border-radius:12px;
padding:6px 0;
box-shadow:0 5px 20px rgba(0,0,0,.4);
z-index:99;
}

.context div{
padding:8px 16px;
font-size:14px;
cursor:pointer;
}

.context div:hover{
background:#2b6cb0;
}

@keyframes fade{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="app">
<div class="header">MC Room</div>
<div class="chat" id="chat"></div>

<div class="input-area">
<div class="icon-btn" onclick="toggleEmoji()">😊</div>
<div class="icon-btn">
<label for="imgUpload">📎</label>
<input type="file" id="imgUpload" hidden accept="image/*">
</div>
<input type="text" id="text" placeholder="Message">
<div class="send" onclick="send()">➤</div>
</div>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("text");
const imgUpload=document.getElementById("imgUpload");

function time(){
const d=new Date();
return d.getHours().toString().padStart(2,'0')+":"+
d.getMinutes().toString().padStart(2,'0');
}

function createMessage(content,type="me",isImage=false){

const wrap=document.createElement("div");
wrap.className="message "+type;

const bubble=document.createElement("div");
bubble.className="bubble";

if(isImage){
const img=document.createElement("img");
img.src=content;
img.className="chat-img";
bubble.appendChild(img);

const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${time()} <span class="check">✔✔</span>`;
bubble.appendChild(meta);
}else{

const textSpan=document.createElement("span");
textSpan.innerText=content;
bubble.appendChild(textSpan);

if(content.length<40){
const inline=document.createElement("span");
inline.className="inline";
inline.innerHTML=`${time()} <span class="check">✔✔</span>`;
bubble.appendChild(inline);
}else{
const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${time()} <span class="check">✔✔</span>`;
bubble.appendChild(meta);
}
}

wrap.appendChild(bubble);
chat.appendChild(wrap);
chat.scrollTop=chat.scrollHeight;

bubble.oncontextmenu=(e)=>{
e.preventDefault();
showMenu(e.pageX,e.pageY,bubble,textSpan);
};
}

function showMenu(x,y,bubble,textSpan){
removeMenu();
const menu=document.createElement("div");
menu.className="context";
menu.style.left=x+"px";
menu.style.top=y+"px";

menu.innerHTML=`
<div onclick="editMsg(this)">Edit</div>
<div onclick="copyMsg(this)">Copy</div>
<div onclick="deleteMsg(this)">Delete</div>
`;

document.body.appendChild(menu);

menu.bubble=bubble;
menu.textSpan=textSpan;
}

function removeMenu(){
const old=document.querySelector(".context");
if(old) old.remove();
}

function deleteMsg(el){
el.parentElement.bubble.parentElement.remove();
removeMenu();
}

function copyMsg(el){
navigator.clipboard.writeText(el.parentElement.bubble.innerText);
removeMenu();
}

function editMsg(el){
const bubble=el.parentElement.bubble;
const text=bubble.querySelector("span");
const newText=prompt("Edit message:",text.innerText);
if(newText){
text.innerText=newText;
}
removeMenu();
}

function send(){
const val=input.value.trim();
if(!val) return;
createMessage(val,"me");
input.value="";
}

imgUpload.onchange=(e)=>{
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=function(ev){
createMessage(ev.target.result,"me",true);
};
reader.readAsDataURL(file);
};

document.body.onclick=removeMenu;

</script>

</body>
</html>
