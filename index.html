<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC System</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji",sans-serif;
background:url("https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg") center/cover no-repeat fixed;
color:white;
overflow:hidden;
}
.app{height:100%;display:flex;flex-direction:column;}
.chat{flex:1;overflow-y:auto;padding:14px;scroll-behavior:smooth;}
.msg{display:flex;margin:4px 0;justify-content:flex-end;}
.bubble{
max-width:78%;
padding:8px 12px;
border-radius:18px;
font-size:15px;
line-height:1.4;
background:#1f6f5c;
border-bottom-right-radius:6px;
position:relative;
word-wrap:break-word;
transform:scale(.9) translateY(10px);
opacity:0;
animation:msgIn .25s cubic-bezier(.22,1,.36,1) forwards;
transition:.2s;
}
@keyframes msgIn{to{transform:scale(1) translateY(0);opacity:1}}
.bubble.hold{transform:scale(1.03) translateY(-2px);}
.meta{font-size:11px;opacity:.85;display:flex;justify-content:flex-end;gap:4px;margin-top:3px;}
.check{color:#4fc3f7}
.edited{font-size:10px;opacity:.6;margin-left:4px;}
.deleted{opacity:.55;font-style:italic;}
img.chat-img{display:block;max-width:100%;border-radius:1.5px;}

/* EDIT BAR */
.edit-bar{
background:#1c1c1c;
padding:8px 14px;
font-size:13px;
display:flex;
justify-content:space-between;
align-items:center;
animation:slideDown .2s ease;
}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.cancel-edit{cursor:pointer;opacity:.7}

/* INPUT */
.input-area{
display:flex;align-items:center;padding:8px;background:rgba(0,0,0,.8);
gap:8px;backdrop-filter:blur(10px);
}
.icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.15s;}
.icon:active{transform:scale(.9)}
input{
flex:1;background:#1e1e1e;border:none;outline:none;color:white;
padding:12px 16px;border-radius:26px;font-size:15px;
}
.send{
width:42px;height:42px;background:#2b6cb0;border-radius:50%;
display:flex;align-items:center;justify-content:center;
cursor:pointer;font-size:18px;transition:.15s;
}
.send:active{transform:scale(.85)}

/* MENU */
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.5);
backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
z-index:999;
}
.menu{
background:#1e1e1e;border-radius:20px;width:240px;overflow:hidden;
animation:menuIn .25s cubic-bezier(.22,1,.36,1);
}
@keyframes menuIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.menu div{padding:16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;}
.menu div:last-child{border:none}
.menu div:active{background:#2b6cb0}
</style>
</head>

<body>
<div class="app">

<div id="editContainer"></div>

<div class="chat" id="chat"></div>

<div class="input-area">
<div class="icon">😊</div>
<input type="text" id="text" placeholder="Message">
<div class="send" id="sendBtn" onclick="handleSend()">➤</div>
</div>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("text");
const sendBtn=document.getElementById("sendBtn");
const editContainer=document.getElementById("editContainer");

let editTarget=null;

/* KEEP KEYBOARD OPEN */
chat.addEventListener("click",()=>input.blur());

function getTime(){
const d=new Date();
return d.getHours().toString().padStart(2,'0')+":"+
d.getMinutes().toString().padStart(2,'0');
}

function createMessage(content){
const wrap=document.createElement("div");
wrap.className="msg";

const bubble=document.createElement("div");
bubble.className="bubble";

const textNode=document.createElement("span");
textNode.innerText=content;

const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${getTime()} <span class="check">✔✔</span>`;

bubble.appendChild(textNode);
bubble.appendChild(meta);

wrap.appendChild(bubble);
chat.appendChild(wrap);
chat.scrollTop=chat.scrollHeight;

/* LONG PRESS */
let timer;
bubble.addEventListener("touchstart",start);
bubble.addEventListener("mousedown",start);
bubble.addEventListener("mouseup",cancel);
bubble.addEventListener("touchend",cancel);

function start(){
bubble.classList.add("hold");
timer=setTimeout(()=>showMenu(bubble,textNode),450);
}
function cancel(){
bubble.classList.remove("hold");
clearTimeout(timer);
}
}

function showMenu(bubble,textNode){
const overlay=document.createElement("div");
overlay.className="overlay";

const menu=document.createElement("div");
menu.className="menu";

menu.innerHTML=`
<div onclick="startEdit()">Edit</div>
<div onclick="copyMsg()">Copy</div>
<div onclick="deleteMsg()">Delete</div>
`;

overlay.appendChild(menu);
document.body.appendChild(overlay);

overlay.bubble=bubble;
overlay.textNode=textNode;
overlay.onclick=e=>{if(e.target===overlay) overlay.remove();}
}

function startEdit(){
const overlay=document.querySelector(".overlay");
editTarget={
bubble:overlay.bubble,
textNode:overlay.textNode
};

input.value=editTarget.textNode.innerText;
input.focus();
sendBtn.innerText="✔";

editContainer.innerHTML=`
<div class="edit-bar">
<span>Mengedit pesan</span>
<span class="cancel-edit" onclick="cancelEdit()">Batal</span>
</div>
`;

overlay.remove();
}

function cancelEdit(){
editTarget=null;
input.value="";
sendBtn.innerText="➤";
editContainer.innerHTML="";
}

function deleteMsg(){
const overlay=document.querySelector(".overlay");
const bubble=overlay.bubble;

bubble.style.opacity="0";
setTimeout(()=>{
bubble.innerHTML="<span class='deleted'>Pesan telah dihapus</span>";
bubble.style.opacity="1";
},200);

overlay.remove();
}

function copyMsg(){
const overlay=document.querySelector(".overlay");
navigator.clipboard.writeText(overlay.textNode.innerText);
overlay.remove();
}

function handleSend(){
const val=input.value.trim();
if(!val) return;

if(editTarget){
editTarget.textNode.innerText=val;

if(!editTarget.bubble.querySelector(".edited")){
const edited=document.createElement("span");
edited.className="edited";
edited.innerText="edited";
editTarget.bubble.querySelector(".meta").appendChild(edited);
}

cancelEdit();
}else{
createMessage(val);
input.value="";
input.focus();
}
}
</script>

</body>
</html>
