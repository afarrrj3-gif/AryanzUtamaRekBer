<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AryanzUtama MC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
background:#070707;
color:white;
overflow-x:hidden;
}

/* GRID BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
background-size:60px 60px;
z-index:-1;
}

/* CONTAINER */

.container{
max-width:420px;
margin:auto;
min-height:100vh;
}

/* BANNER */

.banner{
width:100%;
height:210px;
overflow:hidden;
position:relative;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
animation:zoom 18s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom,transparent,#070707);
}

/* PROFILE */

.profile{
display:flex;
flex-direction:column;
align-items:center;
margin-top:-70px;
position:relative;
z-index:3;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
border:5px solid #070707;
box-shadow:0 0 40px rgba(0,212,255,0.35);
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 20px rgba(0,212,255,0.25)}
to{box-shadow:0 0 50px rgba(0,212,255,0.6)}
}

.name{
margin-top:15px;
font-size:28px;
font-weight:700;
background:linear-gradient(90deg,#fff,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tag{
margin-top:5px;
font-size:13px;
letter-spacing:2px;
color:#9c9c9c;
}

/* MENU */

.menu{
padding:40px 20px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
background:#141414;
border-radius:22px;
padding:22px;
display:flex;
align-items:center;
gap:18px;
border:1px solid #222;
cursor:pointer;
transition:.35s;
}

.card:hover{
transform:translateY(-5px);
border-color:#00d4ff;
box-shadow:0 20px 50px rgba(0,0,0,.7);
}

.icon{
width:58px;
height:58px;
border-radius:18px;
background:linear-gradient(135deg,#00d4ff,#0099cc);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
}

.card-title{
font-size:18px;
font-weight:600;
}

.card-desc{
font-size:13px;
color:#999;
}

/* PAGE SLIDE */

.page{
position:fixed;
inset:0;
background:#070707;
transform:translateX(100%);
transition:.5s cubic-bezier(.4,0,.2,1);
z-index:20;
}

.page.active{
transform:translateX(0);
}

/* HEADER */

.header{
padding:18px;
background:#111;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #222;
}

.back{
width:38px;
height:38px;
border-radius:50%;
background:#1b1b1b;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* FORM */

.form{
padding:30px 20px;
display:flex;
flex-direction:column;
gap:18px;
}

input,select{
padding:16px;
border-radius:12px;
border:1px solid #333;
background:#101010;
color:white;
font-size:15px;
outline:none;
}

button{
padding:16px;
border-radius:12px;
border:none;
background:#00d4ff;
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

/* POPUP */

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:50;
}

.popup.active{
opacity:1;
pointer-events:auto;
}

.popupBox{
background:#111;
padding:30px;
border-radius:20px;
text-align:center;
width:90%;
max-width:320px;
animation:pop .35s;
}

@keyframes pop{
from{transform:scale(.8);opacity:0}
to{transform:scale(1);opacity:1}
}

.code{
font-size:34px;
letter-spacing:6px;
margin:15px 0;
color:#00d4ff;
font-weight:700;
}

.copyBtn{
background:#00d4ff;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="banner">
<img src="https://res.cloudinary.com/dtdodhqqi/image/upload/v1766772767/IMG-20251128-WA0091_ldbe9l.jpg">
</div>

<div class="profile">
<img class="avatar" src="https://res.cloudinary.com/dtdodhqqi/image/upload/v1766845910/IMG-20251128-WA0094_1_rrrhdn.jpg">
<div class="name">AryanzUtama</div>
<div class="tag">POWEREDBYARYANZUTAMA</div>
</div>

<div class="menu">

<div class="card" onclick="openPage('buyer')">
<div class="icon">🛒</div>
<div>
<div class="card-title">Buyer</div>
<div class="card-desc">Masuk dengan kode room</div>
</div>
</div>

<div class="card" onclick="openPage('seller')">
<div class="icon">🏪</div>
<div>
<div class="card-title">Seller</div>
<div class="card-desc">Buat transaksi baru</div>
</div>
</div>

</div>
</div>

<!-- BUYER -->

<div class="page" id="buyer">

<div class="header">
<div class="back" onclick="closePage()">←</div>
Masuk sebagai Buyer
</div>

<div class="form">

<input placeholder="Nama">

<input placeholder="Nomor WhatsApp (08xxxxxxxxxx)">

<input placeholder="Kode Room">

<button>Masuk Room</button>

</div>
</div>

<!-- SELLER -->

<div class="page" id="seller">

<div class="header">
<div class="back" onclick="closePage()">←</div>
Buat Transaksi
</div>

<div class="form">

<input placeholder="Nama">

<input placeholder="Nomor WhatsApp (08xxxxxxxxxx)">

<input id="nominal" placeholder="Nominal">

<select>
<option>Inc</option>
<option>Exc</option>
</select>

<button onclick="createRoom()">Create Room</button>

</div>
</div>

<!-- POPUP ROOM -->

<div class="popup" id="popup">

<div class="popupBox">

Room Code

<div class="code" id="code"></div>

<button class="copyBtn" onclick="copyCode()">Salin</button>

<button onclick="closePopup()" style="margin-top:8px;background:#222;">Tutup</button>

</div>

</div>

<script>

function openPage(id){
document.getElementById(id).classList.add("active")
}

function closePage(){
document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active")
})
}

/* FORMAT RUPIAH */

document.getElementById("nominal").addEventListener("input",function(e){

let number=e.target.value.replace(/\D/g,"")

if(!number) return

number=parseInt(number)

e.target.value="Rp"+number.toLocaleString("id-ID")

})

/* CREATE ROOM */

function createRoom(){

let code=Math.floor(100000+Math.random()*900000)

document.getElementById("code").innerText=code

document.getElementById("popup").classList.add("active")

}

/* COPY */

function copyCode(){

let text=document.getElementById("code").innerText

navigator.clipboard.writeText(text)

alert("Code berhasil disalin")

}

function closePopup(){

document.getElementById("popup").classList.remove("active")

}

</script>

</body>
</html>
