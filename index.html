<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji",sans-serif;
background:url("https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg") center/cover no-repeat fixed;
color:white;
overflow:hidden;
}

.app{
height:100%;
display:flex;
flex-direction:column;
}

.chat{
flex:1;
overflow-y:auto;
padding:14px;
scroll-behavior:smooth;
}

.msg{
display:flex;
margin:4px 0;
justify-content:flex-end;
}

.bubble{
max-width:78%;
padding:8px 12px;
border-radius:18px;
font-size:15px;
line-height:1.4;
background:#1f6f5c;
border-bottom-right-radius:6px;
position:relative;
word-wrap:break-word;
transform:scale(.85) translateY(10px);
opacity:0;
animation:msgIn .25s cubic-bezier(.22,1,.36,1) forwards;
transition:.2s;
}

/* Lift effect on hold */
.bubble.hold{
transform:scale(1.02) translateY(-2px);
}

@keyframes msgIn{
to{
transform:scale(1) translateY(0);
opacity:1;
}
}

.meta{
font-size:11px;
opacity:.85;
display:flex;
justify-content:flex-end;
gap:4px;
margin-top:3px;
}

.inline{
display:inline-flex;
gap:4px;
font-size:11px;
opacity:.85;
margin-left:6px;
}

.check{color:#4fc3f7}

img.chat-img{
display:block;
max-width:100%;
border-radius:1.5px;
}

/* INPUT AREA */
.input-area{
display:flex;
align-items:center;
padding:8px;
background:rgba(0,0,0,.8);
gap:8px;
backdrop-filter:blur(10px);
}

.icon{
width:36px;
height:36px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
transition:.15s;
}

.icon:active{transform:scale(.9)}

input{
flex:1;
background:#1e1e1e;
border:none;
outline:none;
color:white;
padding:12px 16px;
border-radius:26px;
font-size:15px;
}

.send{
width:42px;
height:42px;
background:#2b6cb0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:18px;
transition:.15s;
}

.send:active{
transform:scale(.85);
}

/* CENTER MENU */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
backdrop-filter:blur(6px);
display:flex;
align-items:center;
justify-content:center;
animation:fade .2s ease;
z-index:999;
}

.menu{
background:#1e1e1e;
border-radius:20px;
width:240px;
overflow:hidden;
transform:scale(.7);
opacity:0;
animation:menuIn .25s cubic-bezier(.22,1,.36,1) forwards;
}

@keyframes menuIn{
to{
transform:scale(1);
opacity:1;
}
}

.menu div{
padding:16px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
transition:.15s;
}

.menu div:last-child{border:none}
.menu div:active{background:#2b6cb0}

/* EMOJI PANEL */
.emoji-box{
position:absolute;
bottom:-260px;
left:10px;
background:#1e1e1e;
border-radius:20px;
padding:12px;
display:flex;
flex-wrap:wrap;
gap:8px;
width:240px;
transition:.3s cubic-bezier(.22,1,.36,1);
}

.emoji-box.show{
bottom:70px;
}

.emoji-box span{
font-size:22px;
cursor:pointer;
transition:.1s;
}

.emoji-box span:active{
transform:scale(.8);
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}
</style>
</head>

<body>

<div class="app">
<div class="chat" id="chat"></div>

<div class="emoji-box" id="emojiBox"></div>

<div class="input-area">
<div class="icon" onclick="toggleEmoji()">😊</div>
<div class="icon">
<label for="img">📎</label>
<input type="file" id="img" hidden accept="image/*">
</div>
<input type="text" id="text" placeholder="Message">
<div class="send" onclick="send()">➤</div>
</div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("text");
const imgInput=document.getElementById("img");
const emojiBox=document.getElementById("emojiBox");

const emojis=["😀","😂","😍","🥶","🔥","😎","😭","😡","🤯","👍","🙏","🎉","💸","🚀","❤️","😴","😏","🥵"];

emojis.forEach(e=>{
let span=document.createElement("span");
span.innerText=e;
span.onclick=()=>{input.value+=e};
emojiBox.appendChild(span);
});

function toggleEmoji(){
emojiBox.classList.toggle("show");
}

function getTime(){
const d=new Date();
return d.getHours().toString().padStart(2,'0')+":"+
d.getMinutes().toString().padStart(2,'0');
}

function createMessage(content,isImage=false){

const wrap=document.createElement("div");
wrap.className="msg";

const bubble=document.createElement("div");
bubble.className="bubble";

let textNode;

if(isImage){
const img=document.createElement("img");
img.src=content;
img.className="chat-img";
bubble.appendChild(img);

const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${getTime()} <span class="check">✔✔</span>`;
bubble.appendChild(meta);

}else{
textNode=document.createElement("span");
textNode.innerText=content;
bubble.appendChild(textNode);

if(content.length<45 && !content.includes("\n")){
const inline=document.createElement("span");
inline.className="inline";
inline.innerHTML=`${getTime()} <span class="check">✔✔</span>`;
bubble.appendChild(inline);
}else{
const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${getTime()} <span class="check">✔✔</span>`;
bubble.appendChild(meta);
}
}

wrap.appendChild(bubble);
chat.appendChild(wrap);
chat.scrollTop=chat.scrollHeight;

/* LONG PRESS */
let timer;
bubble.addEventListener("touchstart",start);
bubble.addEventListener("mousedown",start);
bubble.addEventListener("mouseup",cancel);
bubble.addEventListener("touchend",cancel);

function start(){
bubble.classList.add("hold");
timer=setTimeout(()=>showMenu(bubble,textNode),450);
}
function cancel(){
bubble.classList.remove("hold");
clearTimeout(timer);
}
}

function showMenu(bubble,textNode){
const overlay=document.createElement("div");
overlay.className="overlay";

const menu=document.createElement("div");
menu.className="menu";

menu.innerHTML=`
<div onclick="editMsg()">Edit</div>
<div onclick="copyMsg()">Copy</div>
<div onclick="deleteMsg()">Delete</div>
`;

overlay.appendChild(menu);
document.body.appendChild(overlay);

overlay.bubble=bubble;
overlay.textNode=textNode;
overlay.onclick=e=>{if(e.target===overlay) overlay.remove();}
}

function deleteMsg(){
const overlay=document.querySelector(".overlay");
overlay.bubble.parentElement.remove();
overlay.remove();
}

function copyMsg(){
const overlay=document.querySelector(".overlay");
if(overlay.textNode)
navigator.clipboard.writeText(overlay.textNode.innerText);
overlay.remove();
}

function editMsg(){
const overlay=document.querySelector(".overlay");
if(!overlay.textNode) return;
const newText=prompt("Edit message:",overlay.textNode.innerText);
if(newText) overlay.textNode.innerText=newText;
overlay.remove();
}

function send(){
const val=input.value.trim();
if(!val) return;
createMessage(val,false);
input.value="";
emojiBox.classList.remove("show");
}

imgInput.onchange=e=>{
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=ev=>createMessage(ev.target.result,true);
reader.readAsDataURL(file);
};
</script>

</body>
</html>
