<!DOCTYPE html>
<html>
<head>

<title>MC Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

#chat{
display:none;
}

#messages{
height:300px;
overflow:auto;
border:1px solid #444;
padding:10px;
margin-top:10px;
text-align:left;
}

input,button{
padding:10px;
margin:5px;
}

</style>

</head>

<body>

<h2>MC Chat System</h2>

<div id="menu">

<h3>Seller</h3>

<input id="sellerName" placeholder="Nama Seller">

<button onclick="createRoom()">Create Room</button>

<hr>

<h3>Buyer</h3>

<input id="buyerName" placeholder="Nama Buyer">

<input id="roomInput" placeholder="Room Code">

<button onclick="joinRoom()">Join Room</button>

</div>


<div id="chat">

<h3 id="roomTitle"></h3>

<div id="messages"></div>

<input id="msg" placeholder="Ketik pesan">

<button onclick="sendMsg()">Send</button>

</div>


<script>

const { createClient } = supabase

const db = createClient(
"https://lmpbrrlhacfriuazrtok.supabase.co",
"sb_publishable_1IojCH_Rna58hbUhTdR6bg_arFswmgw"
)

let room=""
let name=""

function createRoom(){

name=document.getElementById("sellerName").value

room=Math.floor(100000+Math.random()*900000).toString()

alert("Room Code: "+room)

startChat()

}

function joinRoom(){

name=document.getElementById("buyerName").value

room=document.getElementById("roomInput").value

startChat()

}

function startChat(){

document.getElementById("menu").style.display="none"

document.getElementById("chat").style.display="block"

document.getElementById("roomTitle").innerText="Room: "+room

loadMessages()

listen()

}

async function sendMsg(){

let text=document.getElementById("msg").value

await db.from("messages").insert({

room:room,
sender:name,
message:text

})

document.getElementById("msg").value=""

}

async function loadMessages(){

const {data}=await db

.from("messages")

.select("*")

.eq("room",room)

.order("created_at")

data.forEach(addMsg)

}

function addMsg(m){

let div=document.createElement("div")

div.innerText=m.sender+" : "+m.message

document.getElementById("messages").appendChild(div)

}

function listen(){

db.channel("chat-"+room)

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:"room=eq."+room
},
payload=>{

addMsg(payload.new)

}
)

.subscribe()

}

</script>

</body>
</html>
