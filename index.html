<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Clone Realtime</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; background: #e6eff5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { background: white; padding: 10px; border-radius: 10px; max-width: 70%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-message { align-self: flex-end; background: #dcf8c6; }
        #input-area { padding: 20px; background: white; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Tulis pesan...">
        <button onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        // 1. Inisialisasi Supabase (Ganti dengan punyamu!)
        const SUPABASE_URL = 'https://lmpbrrlhacfriuazrtok.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZyOAm9p6EXzOZobH-QNvbQ_7F4imDAF';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('messageInput');
        const myName = "User_" + Math.floor(Math.random() * 1000); // Nama dummy

        // 2. Ambil Pesan Lama saat Load
        async function fetchMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });
            
            if (data) data.forEach(msg => appendMessage(msg));
        }

        // 3. Fungsi Tambah Pesan ke UI
        function appendMessage(msg) {
            const div = document.createElement('div');
            div.classList.add('message');
            if (msg.sender === myName) div.classList.add('my-message');
            div.innerHTML = `<strong>${msg.sender}</strong>: ${msg.content}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 4. Fitur REAL-TIME (Mendengarkan perubahan tabel)
        supabase
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new);
            })
            .subscribe();

        // 5. Fungsi Kirim Pesan
        async function sendMessage() {
            const text = messageInput.value;
            if (!text) return;

            const { error } = await supabase
                .from('messages')
                .insert([{ content: text, sender: myName }]);

            if (error) console.error("Gagal kirim:", error);
            messageInput.value = '';
        }

        fetchMessages();
    </script>
</body>
</html>
