<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MC Room Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#0f0f0f;
color:white;
text-align:center;
padding:30px;
}

.container{
max-width:500px;
margin:auto;
}

.box{
background:#1c1c1c;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:none;
}

button{
background:#00bfff;
color:white;
cursor:pointer;
}

#chatArea{
display:none;
}

#messages{
height:300px;
overflow:auto;
background:#111;
padding:10px;
border-radius:6px;
margin-bottom:10px;
text-align:left;
}

</style>
</head>

<body>

<div class="container">

<h1>MC Chat Room</h1>

<div id="menu">

<div class="box">

<h2>Seller</h2>

<input id="sellerName" placeholder="Nama Seller">

<button onclick="createRoom()">Create Room</button>

</div>

<div class="box">

<h2>Buyer</h2>

<input id="buyerName" placeholder="Nama Buyer">

<input id="roomCodeInput" placeholder="Room Code">

<button onclick="joinRoom()">Join Room</button>

</div>

</div>


<div id="chatArea">

<h2 id="roomTitle"></h2>

<div id="messages"></div>

<input id="msgInput" placeholder="Ketik pesan">

<button onclick="sendMessage()">Kirim</button>

</div>

</div>


<script>

const { createClient } = supabase

const SUPABASE_URL="https://lmpbrrlhacfriuazrtok.supabase.co"
const SUPABASE_KEY="sb_publishable_ZyOAm9p6EXzOZobH-QNvbQ_7F4imDAF"

const db=createClient(SUPABASE_URL,SUPABASE_KEY)

let roomCode=""
let userName=""


// SELLER CREATE ROOM

async function createRoom(){

userName=document.getElementById("sellerName").value

if(!userName){

alert("Masukkan nama")

return

}

roomCode=Math.floor(100000+Math.random()*900000).toString()

await db.from("rooms").insert([
{
room_code:roomCode,
seller_name:userName
}
])

startChat()

}


// BUYER JOIN ROOM

async function joinRoom(){

userName=document.getElementById("buyerName").value
roomCode=document.getElementById("roomCodeInput").value

if(!roomCode){

alert("Masukkan code")

return

}

const {data}=await db
.from("rooms")
.select("*")
.eq("room_code",roomCode)
.single()

if(!data){

alert("Room tidak ditemukan")

return

}

startChat()

}


// START CHAT

function startChat(){

document.getElementById("menu").style.display="none"

document.getElementById("chatArea").style.display="block"

document.getElementById("roomTitle").innerText="Room : "+roomCode

listenChat()

}


// SEND MESSAGE

async function sendMessage(){

const msg=document.getElementById("msgInput").value

if(!msg) return

await db.from("messages").insert([
{
room_code:roomCode,
sender:userName,
message:msg
}
])

document.getElementById("msgInput").value=""

}


// REALTIME LISTENER

function listenChat(){

db.channel("chat")

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:`room_code=eq.${roomCode}`
},
(payload)=>{

const data=payload.new

const div=document.createElement("div")

div.innerText=data.sender+" : "+data.message

document.getElementById("messages").appendChild(div)

})

.subscribe()

}

</script>

</body>
</html>
