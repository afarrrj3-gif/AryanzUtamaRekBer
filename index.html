<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AryanzUtama - MC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
background:#070707;
color:white;
overflow-x:hidden;
}

/* BACKGROUND GRID */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
background-size:60px 60px;
z-index:-1;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 80%,rgba(0,212,255,0.05),transparent 50%),
radial-gradient(circle at 80% 20%,rgba(0,212,255,0.05),transparent 50%);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:420px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* BANNER */

.banner{
width:100%;
height:200px;
overflow:hidden;
position:relative;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
animation:zoom 20s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom,transparent, #070707);
}

/* PROFILE */

.profile{
display:flex;
flex-direction:column;
align-items:center;
margin-top:-60px;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #070707;
box-shadow:0 0 30px rgba(0,212,255,0.3);
}

.name{
margin-top:15px;
font-size:28px;
font-weight:700;
background:linear-gradient(90deg,#fff,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tag{
color:#888;
font-size:13px;
letter-spacing:2px;
margin-top:5px;
}

/* BUTTON AREA */

.menu{
padding:40px 20px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
background:#151515;
border-radius:22px;
padding:22px;
display:flex;
align-items:center;
gap:18px;
cursor:pointer;
transition:.35s;
border:1px solid #222;
}

.card:hover{
transform:translateY(-4px);
border-color:#00d4ff;
box-shadow:0 15px 40px rgba(0,0,0,.6);
}

.icon{
width:60px;
height:60px;
border-radius:18px;
background:linear-gradient(135deg,#00d4ff,#00a8cc);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.card-title{
font-size:18px;
font-weight:600;
}

.card-desc{
font-size:13px;
color:#999;
}

/* PAGE TRANSITION */

.page{
position:fixed;
inset:0;
background:#070707;
transform:translateX(100%);
transition:.5s cubic-bezier(.4,0,.2,1);
z-index:10;
}

.page.active{
transform:translateX(0);
}

/* HEADER */

.header{
padding:18px;
background:#111;
border-bottom:1px solid #222;
display:flex;
align-items:center;
gap:10px;
}

.back{
width:36px;
height:36px;
border-radius:50%;
background:#1a1a1a;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.form{
padding:30px 20px;
display:flex;
flex-direction:column;
gap:20px;
}

input,select{
padding:15px;
border-radius:12px;
border:1px solid #333;
background:#111;
color:white;
font-size:15px;
outline:none;
}

button{
padding:16px;
border:none;
border-radius:12px;
background:#00d4ff;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="banner">
<img src="https://res.cloudinary.com/dtdodhqqi/image/upload/v1766772767/IMG-20251128-WA0091_ldbe9l.jpg">
</div>

<div class="profile">
<img class="avatar" src="https://res.cloudinary.com/dtdodhqqi/image/upload/v1766845910/IMG-20251128-WA0094_1_rrrhdn.jpg">
<div class="name">AryanzUtama</div>
<div class="tag">POWEREDBYARYANZUTAMA</div>
</div>

<div class="menu">

<div class="card" onclick="openPage('buyer')">
<div class="icon">🛒</div>
<div>
<div class="card-title">Buyer</div>
<div class="card-desc">Masuk dengan kode room</div>
</div>
</div>

<div class="card" onclick="openPage('seller')">
<div class="icon">🏪</div>
<div>
<div class="card-title">Seller</div>
<div class="card-desc">Buat transaksi baru</div>
</div>
</div>

</div>

</div>

<!-- BUYER PAGE -->

<div class="page" id="buyer">

<div class="header">
<div class="back" onclick="closePage()">←</div>
Masuk sebagai Buyer
</div>

<div class="form">

<input placeholder="Nama">
<input placeholder="Nomor WhatsApp">
<input placeholder="Kode Room">

<button>Masuk Room</button>

</div>

</div>

<!-- SELLER PAGE -->

<div class="page" id="seller">

<div class="header">
<div class="back" onclick="closePage()">←</div>
Buat Transaksi
</div>

<div class="form">

<input placeholder="Nama">
<input placeholder="Nomor WhatsApp">
<input placeholder="Nominal">

<select>
<option>Include</option>
<option>Exclude</option>
</select>

<button>Create Room</button>

</div>

</div>

<script>

function openPage(page){
document.getElementById(page).classList.add("active")
}

function closePage(){
document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active")
})
}

</script>

</body>
</html>
