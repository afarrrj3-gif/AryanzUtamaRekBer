<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenix Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

.chat-container{
  width:100%;
  max-width:420px;
  height:95vh;
  display:flex;
  flex-direction:column;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.chat-header{
  background:#111b21;
  color:white;
  padding:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#00a884,#008069);
}

/* CHAT AREA */
.chat-box{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:url('https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg');
  background-size:cover;
  background-position:center;
  scroll-behavior:smooth;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* MESSAGE */
.message{
  display:inline-block;
  max-width:75%;
  padding:8px 12px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
  animation:fadeIn .2s ease;
}

.sent{
  align-self:flex-end;
  background:#005c4b;
  color:white;
  border-bottom-right-radius:4px;
}

.received{
  align-self:flex-start;
  background:#202c33;
  color:white;
  border-bottom-left-radius:4px;
}

/* META INSIDE FLEX */
.meta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  opacity:.85;
  margin-left:6px;
}

.check{
  transition:.3s;
}

/* IMAGE FIX */
.chat-img{
  max-width:240px;
  border-radius:14px;
  display:block;
  margin-bottom:6px;
}

/* INPUT TELEGRAM STYLE */
.chat-input{
  background:#0f0f0f;
  padding:8px;
}

.input-wrapper{
  background:#1f1f1f;
  border-radius:30px;
  display:flex;
  align-items:center;
  padding:6px 12px;
  gap:10px;
}

.input-wrapper input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:15px;
}

.icon{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4fc3f7;
}

.send-mic{
  background:#4fc3f7;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* EMOJI PANEL */
.emoji-panel{
  display:none;
  background:#111;
  padding:8px;
  font-size:22px;
  flex-wrap:wrap;
  gap:10px;
}

.emoji-panel span{
  cursor:pointer;
  margin:5px;
  transition:.2s;
}

.emoji-panel span:hover{
  transform:scale(1.2);
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="avatar"></div>
    ZenixStore
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="emoji-panel" id="emojiPanel">
    <span>😂</span>
    <span>❤️</span>
    <span>🔥</span>
    <span>👍</span>
    <span>😎</span>
    <span>😭</span>
    <span>😡</span>
  </div>

  <div class="chat-input">
    <div class="input-wrapper">
      <button class="icon" onclick="toggleEmoji()">😊</button>
      <input type="text" id="messageInput" placeholder="Message">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <button class="icon" onclick="openGallery()">📎</button>
      <div class="send-mic" onclick="sendMessage()">➤</div>
    </div>
  </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const emojiPanel = document.getElementById("emojiPanel");
const imageInput = document.getElementById("imageInput");

function getTime(){
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ":" +
         now.getMinutes().toString().padStart(2,'0');
}

function toggleEmoji(){
  emojiPanel.style.display =
    emojiPanel.style.display === "flex" ? "none" : "flex";
}

emojiPanel.querySelectorAll("span").forEach(e=>{
  e.onclick=()=> messageInput.value += e.textContent;
});

function applyReadEffect(checkEl){
  setTimeout(()=>{ checkEl.innerHTML="✓✓"; },800);
  setTimeout(()=>{ checkEl.style.color="#4fc3f7"; },1500);
}

function createMeta(){
  const meta=document.createElement("span");
  meta.className="meta";
  const time=document.createElement("span");
  time.textContent=getTime();
  const check=document.createElement("span");
  check.className="check";
  check.textContent="✓";
  meta.appendChild(time);
  meta.appendChild(check);
  applyReadEffect(check);
  return meta;
}

function sendMessage(){
  const text=messageInput.value.trim();
  if(text==="") return;

  const msg=document.createElement("div");
  msg.className="message sent";

  const textNode=document.createElement("span");
  textNode.textContent=text;

  msg.appendChild(textNode);
  msg.appendChild(createMeta());

  chatBox.appendChild(msg);
  chatBox.scrollTop=chatBox.scrollHeight;
  messageInput.value="";
  emojiPanel.style.display="none";
}

function openGallery(){
  imageInput.click();
}

imageInput.addEventListener("change",function(){
  const file=this.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=function(e){
    const msg=document.createElement("div");
    msg.className="message sent";

    const img=document.createElement("img");
    img.src=e.target.result;
    img.className="chat-img";

    msg.appendChild(img);
    msg.appendChild(createMeta());

    chatBox.appendChild(msg);
    chatBox.scrollTop=chatBox.scrollHeight;
  };
  reader.readAsDataURL(file);
});

messageInput.addEventListener("keypress",e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
