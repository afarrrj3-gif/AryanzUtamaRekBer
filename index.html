<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC System</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:url("https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg") no-repeat center center fixed;
background-size:cover;
}

.app{
height:100%;
display:flex;
flex-direction:column;
}

.chat{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
display:flex;
margin:3px 0;
animation:fade .15s ease;
}

.me{justify-content:flex-end}

.bubble{
position:relative;
max-width:78%;
padding:7px 10px;
border-radius:16px;
font-size:15px;
line-height:1.35;
word-wrap:break-word;
background:#1f6f5c;
color:white;
border-bottom-right-radius:5px;
}

.inline{
display:inline-flex;
gap:4px;
font-size:11px;
opacity:.85;
margin-left:6px;
}

.meta{
font-size:11px;
opacity:.85;
display:flex;
justify-content:flex-end;
gap:4px;
margin-top:3px;
}

.check{color:#4fc3f7}

img.chat-img{
display:block;
max-width:100%;
border-radius:4px;   /* FIXED SUPER KECIL */
}

.input-area{
display:flex;
align-items:center;
padding:8px;
background:rgba(0,0,0,.75);
gap:8px;
}

.icon{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
color:white;
cursor:pointer;
}

input{
flex:1;
background:#1e1e1e;
border:none;
outline:none;
color:white;
padding:10px 14px;
border-radius:22px;
font-size:15px;
}

.send{
width:38px;
height:38px;
background:#2b6cb0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
cursor:pointer;
}

.context-menu{
position:fixed;
background:#1e1e1e;
border-radius:14px;
padding:6px 0;
width:160px;
box-shadow:0 10px 30px rgba(0,0,0,.6);
animation:scaleIn .15s ease;
z-index:999;
}

.context-menu div{
padding:10px 16px;
color:white;
font-size:14px;
cursor:pointer;
}

.context-menu div:hover{
background:#2b6cb0;
}

@keyframes fade{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes scaleIn{
from{transform:scale(.8);opacity:0}
to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="app">
<div class="chat" id="chat"></div>

<div class="input-area">
<div class="icon">😊</div>
<div class="icon">
<label for="img">📎</label>
<input type="file" id="img" hidden accept="image/*">
</div>
<input type="text" id="text" placeholder="Message">
<div class="send" onclick="send()">➤</div>
</div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("text");
const imgInput=document.getElementById("img");

function getTime(){
const d=new Date();
return d.getHours().toString().padStart(2,'0')+":"+
d.getMinutes().toString().padStart(2,'0');
}

function createMessage(content,isImage=false){

const wrap=document.createElement("div");
wrap.className="msg me";

const bubble=document.createElement("div");
bubble.className="bubble";

let textNode;

if(isImage){
const img=document.createElement("img");
img.src=content;
img.className="chat-img";
bubble.appendChild(img);

const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${getTime()} <span class="check">✔✔</span>`;
bubble.appendChild(meta);

}else{

textNode=document.createElement("span");
textNode.innerText=content;
bubble.appendChild(textNode);

if(content.length<45 && !content.includes("\n")){
const inline=document.createElement("span");
inline.className="inline";
inline.innerHTML=`${getTime()} <span class="check">✔✔</span>`;
bubble.appendChild(inline);
}else{
const meta=document.createElement("div");
meta.className="meta";
meta.innerHTML=`${getTime()} <span class="check">✔✔</span>`;
bubble.appendChild(meta);
}
}

wrap.appendChild(bubble);
chat.appendChild(wrap);
chat.scrollTop=chat.scrollHeight;

/* LONG PRESS */
let pressTimer;
bubble.addEventListener("touchstart",startPress);
bubble.addEventListener("mousedown",startPress);
bubble.addEventListener("touchend",cancelPress);
bubble.addEventListener("mouseup",cancelPress);

function startPress(e){
pressTimer=setTimeout(()=>{
showMenu(e,bubble,textNode);
},500);
}
function cancelPress(){clearTimeout(pressTimer);}
}

function showMenu(e,bubble,textNode){
removeMenu();
const menu=document.createElement("div");
menu.className="context-menu";
menu.innerHTML=`
<div onclick="editMsg()">Edit</div>
<div onclick="copyMsg()">Copy</div>
<div onclick="deleteMsg()">Delete</div>
`;
document.body.appendChild(menu);
menu.style.left=(e.touches?e.touches[0].pageX:e.pageX)+"px";
menu.style.top=(e.touches?e.touches[0].pageY:e.pageY)+"px";
menu.bubble=bubble;
menu.textNode=textNode;
}

function removeMenu(){
const old=document.querySelector(".context-menu");
if(old) old.remove();
}

function deleteMsg(){
const menu=document.querySelector(".context-menu");
menu.bubble.parentElement.remove();
removeMenu();
}

function copyMsg(){
const menu=document.querySelector(".context-menu");
navigator.clipboard.writeText(menu.bubble.innerText);
removeMenu();
}

function editMsg(){
const menu=document.querySelector(".context-menu");
if(!menu.textNode) return;
const newText=prompt("Edit message:",menu.textNode.innerText);
if(newText){
menu.textNode.innerText=newText;
}
removeMenu();
}

function send(){
const val=input.value.trim();
if(!val) return;
createMessage(val,false);
input.value="";
}

imgInput.onchange=e=>{
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=ev=>{
createMessage(ev.target.result,true);
};
reader.readAsDataURL(file);
};

document.body.onclick=removeMenu;
</script>

</body>
</html>
