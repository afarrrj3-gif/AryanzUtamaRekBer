<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenix Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

.chat-container{
  width:100%;
  max-width:420px;
  height:95vh;
  display:flex;
  flex-direction:column;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.chat-header{
  background:#111b21;
  color:white;
  padding:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#00a884,#008069);
}

/* CHAT AREA */
.chat-box{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:url('https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg');
  background-size:cover;
  background-position:center;
  scroll-behavior:smooth;

  display:flex;
  flex-direction:column;
  gap:8px;
}

/* MESSAGE */
.message{
  position:relative;
  padding:8px 12px 18px 12px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
  max-width:75%;
  width:fit-content;
  animation:fadeIn .2s ease;
}

.sent{
  align-self:flex-end;
  background:#005c4b;
  color:white;
  border-bottom-right-radius:4px;
}

.received{
  align-self:flex-start;
  background:#202c33;
  color:white;
  border-bottom-left-radius:4px;
}

.meta{
  position:absolute;
  bottom:4px;
  right:8px;
  font-size:10px;
  opacity:.85;
  display:flex;
  gap:4px;
  align-items:center;
}

.check{
  font-size:11px;
  transition:.3s;
}

/* INPUT TELEGRAM STYLE */
.chat-input{
  background:#111b21;
  padding:10px;
}

.input-wrapper{
  background:#202c33;
  border-radius:30px;
  display:flex;
  align-items:center;
  padding:6px 10px;
  gap:8px;
}

.input-wrapper input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:14px;
}

.circle-btn{
  background:#2a3942;
  border:none;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.circle-btn:hover{
  background:#324b57;
}

.send-btn{
  background:#00a884;
}

.send-btn:hover{
  background:#008069;
}

.emoji-panel{
  display:none;
  background:#111b21;
  padding:8px;
  font-size:22px;
  flex-wrap:wrap;
  gap:10px;
}

.emoji-panel span{
  cursor:pointer;
  margin:5px;
  transition:.2s;
}

.emoji-panel span:hover{
  transform:scale(1.2);
}

img.chat-img{
  max-width:100%;
  border-radius:12px;
  margin-bottom:12px;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="avatar"></div>
    ZenixStore
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="emoji-panel" id="emojiPanel">
    <span>😂</span>
    <span>❤️</span>
    <span>🔥</span>
    <span>👍</span>
    <span>😎</span>
    <span>😭</span>
    <span>😡</span>
  </div>

  <div class="chat-input">
    <div class="input-wrapper">
      <button class="circle-btn" onclick="toggleEmoji()">😊</button>
      <input type="text" id="messageInput" placeholder="Message">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <button class="circle-btn" onclick="openGallery()">📎</button>
      <button class="circle-btn send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const emojiPanel = document.getElementById("emojiPanel");
const imageInput = document.getElementById("imageInput");

function getTime(){
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ":" +
         now.getMinutes().toString().padStart(2,'0');
}

function toggleEmoji(){
  emojiPanel.style.display =
    emojiPanel.style.display === "flex" ? "none" : "flex";
}

emojiPanel.querySelectorAll("span").forEach(e=>{
  e.onclick=()=> messageInput.value += e.textContent;
});

function applyReadEffect(msg){
  setTimeout(()=>{
    msg.querySelector(".check").innerHTML="✓✓";
  },800);

  setTimeout(()=>{
    msg.querySelector(".check").style.color="#4fc3f7";
  },1500);
}

function sendMessage(){
  const text = messageInput.value.trim();
  if(text==="") return;

  const msg = document.createElement("div");
  msg.className="message sent";
  msg.innerHTML=`
    ${text}
    <div class="meta">
      ${getTime()}
      <span class="check">✓</span>
    </div>
  `;

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
  messageInput.value="";
  emojiPanel.style.display="none";

  applyReadEffect(msg);
}

function openGallery(){
  imageInput.click();
}

imageInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    const msg = document.createElement("div");
    msg.className="message sent";
    msg.innerHTML=`
      <img src="${e.target.result}" class="chat-img">
      <div class="meta">
        ${getTime()}
        <span class="check">✓</span>
      </div>
    `;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;

    applyReadEffect(msg);
  };
  reader.readAsDataURL(file);
});

messageInput.addEventListener("keypress", e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
