<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AryanzUtama - MC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
background:#060606;
color:white;
overflow-x:hidden;
}

/* GRID BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
background-size:60px 60px;
z-index:-1;
}

.container{
max-width:420px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* BANNER */

.banner{
width:100%;
height:200px;
position:relative;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
animation:zoom 20s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

.banner::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom,transparent,#060606);
}

/* PROFILE */

.profile{
display:flex;
flex-direction:column;
align-items:center;
margin-top:-70px;
position:relative;
z-index:2;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
border:5px solid #060606;
box-shadow:0 0 35px rgba(0,212,255,0.35);
}

/* TEXT */

.name{
margin-top:15px;
font-size:28px;
font-weight:700;
background:linear-gradient(90deg,#fff,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tag{
margin-top:5px;
font-size:13px;
color:#9c9c9c;
letter-spacing:2px;
}

/* MENU */

.menu{
padding:40px 20px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
background:#141414;
border-radius:22px;
padding:22px;
display:flex;
align-items:center;
gap:18px;
border:1px solid #222;
cursor:pointer;
transition:.35s;
}

.card:hover{
border-color:#00d4ff;
transform:translateY(-3px);
box-shadow:0 15px 40px rgba(0,0,0,.7);
}

.icon{
width:58px;
height:58px;
border-radius:18px;
background:linear-gradient(135deg,#00d4ff,#00a6c8);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
}

.card-title{
font-size:18px;
font-weight:600;
}

.card-desc{
font-size:13px;
color:#999;
}

/* PAGE SLIDE */

.page{
position:fixed;
inset:0;
background:#060606;
transform:translateX(100%);
transition:.45s cubic-bezier(.4,0,.2,1);
z-index:10;
}

.page.active{
transform:translateX(0);
}

/* HEADER */

.header{
padding:18px;
background:#111;
display:flex;
align-items:center;
gap:10px;
border-bottom:1px solid #222;
}

.back{
width:36px;
height:36px;
border-radius:50%;
background:#1c1c1c;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* FORM */

.form{
padding:30px 20px;
display:flex;
flex-direction:column;
gap:18px;
}

input,select{
padding:16px;
border-radius:12px;
border:1px solid #333;
background:#101010;
color:white;
font-size:15px;
outline:none;
}

button{
padding:16px;
border-radius:12px;
border:none;
background:#00d4ff;
color:white;
font-weight:600;
cursor:pointer;
}

.roomCode{
display:none;
background:#00d4ff;
padding:25px;
border-radius:16px;
text-align:center;
font-size:28px;
letter-spacing:6px;
font-weight:700;
}

</style>
</head>

<body>

<div class="container">

<div class="banner">
<img src="https://res.cloudinary.com/dtdodhqqi/image/upload/v1766772767/IMG-20251128-WA0091_ldbe9l.jpg">
</div>

<div class="profile">
<img class="avatar" src="https://res.cloudinary.com/dtdodhqqi/image/upload/v1766845910/IMG-20251128-WA0094_1_rrrhdn.jpg">
<div class="name">AryanzUtama</div>
<div class="tag">POWEREDBYARYANZUTAMA</div>
</div>

<div class="menu">

<div class="card" onclick="openPage('buyer')">
<div class="icon">🛒</div>
<div>
<div class="card-title">Buyer</div>
<div class="card-desc">Masuk dengan kode room</div>
</div>
</div>

<div class="card" onclick="openPage('seller')">
<div class="icon">🏪</div>
<div>
<div class="card-title">Seller</div>
<div class="card-desc">Buat transaksi baru</div>
</div>
</div>

</div>

</div>

<!-- BUYER PAGE -->

<div class="page" id="buyer">

<div class="header">
<div class="back" onclick="closePage()">←</div>
Masuk sebagai Buyer
</div>

<div class="form">

<input placeholder="Nama">
<input placeholder="Nomor WhatsApp">
<input placeholder="Kode Room">

<button>Masuk Room</button>

</div>

</div>

<!-- SELLER PAGE -->

<div class="page" id="seller">

<div class="header">
<div class="back" onclick="closePage()">←</div>
Buat Transaksi
</div>

<div class="form">

<input placeholder="Nama">
<input placeholder="Nomor WhatsApp">
<input id="nominal" placeholder="Nominal">

<select>
<option value="inc">Include</option>
<option value="exc">Exclude</option>
</select>

<div class="roomCode" id="roomCode"></div>

<button id="createBtn" onclick="createRoom()">Create Room</button>
<button id="enterBtn" style="display:none;">Masuk Room</button>

</div>

</div>

<script>

function openPage(page){
document.getElementById(page).classList.add("active")
}

function closePage(){
document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active")
})
}

function createRoom(){

const code=Math.floor(100000+Math.random()*900000)

document.getElementById("roomCode").style.display="block"
document.getElementById("roomCode").innerText=code

document.getElementById("createBtn").style.display="none"
document.getElementById("enterBtn").style.display="block"

}

</script>

</body>
</html>
