<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenix Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter', sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

/* CHAT WRAPPER */
.chat-container{
  width:100%;
  max-width:420px;
  height:95vh;
  display:flex;
  flex-direction:column;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* HEADER */
.chat-header{
  background:#111b21;
  color:white;
  padding:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#00a884,#008069);
}

/* CHAT AREA */
.chat-box{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:url('https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg');
  background-size:cover;
  background-position:center;
  scroll-behavior:smooth;
}

/* MESSAGE STYLE */
.message{
  max-width:75%;
  padding:8px 12px;
  margin-bottom:10px;
  border-radius:12px;
  font-size:14px;
  position:relative;
  animation:fadeIn .15s ease;
  word-wrap:break-word;
}

.sent{
  background:#005c4b;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.received{
  background:#202c33;
  color:white;
  border-bottom-left-radius:4px;
}

/* TIME & CHECK */
.meta{
  font-size:10px;
  opacity:.7;
  margin-top:3px;
  text-align:right;
  display:flex;
  justify-content:flex-end;
  gap:4px;
  align-items:center;
}

.check{
  font-size:11px;
}

/* INPUT */
.chat-input{
  background:#111b21;
  padding:10px;
  display:flex;
  gap:10px;
}

.chat-input input{
  flex:1;
  padding:10px 15px;
  border-radius:20px;
  border:none;
  outline:none;
  background:#202c33;
  color:white;
}

.chat-input button{
  background:#00a884;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  transition:.2s;
}

.chat-input button:hover{
  background:#008069;
}

.chat-box::-webkit-scrollbar{
  width:4px;
}
.chat-box::-webkit-scrollbar-thumb{
  background:#555;
  border-radius:10px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="avatar"></div>
    ZenixStore
  </div>

  <div class="chat-box" id="chatBox">
  </div>

  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Ketik pesan...">
    <button onclick="sendMessage()">Kirim</button>
  </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");

function getTime(){
  const now = new Date();
  let h = now.getHours().toString().padStart(2,'0');
  let m = now.getMinutes().toString().padStart(2,'0');
  return h + ":" + m;
}

function sendMessage(){
  const text = messageInput.value.trim();
  if(text === "") return;

  const msg = document.createElement("div");
  msg.classList.add("message","sent");
  msg.innerHTML = `
    ${text}
    <div class="meta">
      ${getTime()}
      <span class="check">✓</span>
    </div>
  `;

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
  messageInput.value = "";

  // Change to double check after 1s
  setTimeout(()=>{
    msg.querySelector(".check").innerHTML = "✓✓";
  },1000);

  // Auto reply simulation
  setTimeout(()=>{
    autoReply();
  },1500);
}

function autoReply(){
  const reply = document.createElement("div");
  reply.classList.add("message","received");
  reply.innerHTML = `
    Pesan diterima ✅
    <div class="meta">${getTime()}</div>
  `;
  chatBox.appendChild(reply);
  chatBox.scrollTop = chatBox.scrollHeight;
}

messageInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    sendMessage();
  }
});
</script>

</body>
</html>
