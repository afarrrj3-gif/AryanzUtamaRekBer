<!DOCTYPE html>
<html>
<head>

<title>Realtime Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Realtime Chat</h2>

Room Code
<input id="room">

Nama
<input id="name">

<button onclick="enterRoom()">Masuk Room</button>

<hr>

<div id="chat" style="display:none">

<div id="messages" style="height:300px;overflow:auto;border:1px solid black"></div>

<input id="msg">

<button onclick="sendMsg()">Send</button>

</div>

<script>

const { createClient } = supabase

const db = createClient(
"https://cwpgfzqmxypscasngopc.supabase.co",
"sb_publishable_1IojCH_Rna58hbUhTdR6bg_arFswmgw"
)

let room=""
let name=""

function enterRoom(){

room=document.getElementById("room").value
name=document.getElementById("name").value

document.getElementById("chat").style.display="block"

listen()

loadMessages()

}

async function sendMsg(){

let text=document.getElementById("msg").value

await db.from("messages").insert({

room:room,
sender:name,
message:text

})

document.getElementById("msg").value=""

}

async function loadMessages(){

const {data}=await db
.from("messages")
.select("*")
.eq("room",room)
.order("created_at")

data.forEach(addMsg)

}

function addMsg(m){

let div=document.createElement("div")

div.innerText=m.sender+" : "+m.message

document.getElementById("messages").appendChild(div)

}

function listen(){

db.channel("chat-"+room)

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:"room=eq."+room
},
payload=>{

addMsg(payload.new)

}
)

.subscribe()

}

</script>

</body>
</html>
