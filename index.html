<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenix Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

.chat-container{
  width:100%;
  max-width:420px;
  height:95vh;
  display:flex;
  flex-direction:column;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.chat-header{
  background:#111b21;
  color:white;
  padding:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#00a884,#008069);
}

.chat-box{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:url('https://res.cloudinary.com/dtdodhqqi/image/upload/v1771310542/c36725a5a2a254a5df8c7dd4bdaa05af_v3tzna.jpg');
  background-size:cover;
  background-position:center;
  scroll-behavior:smooth;
}

.message {
  display: inline-block;
  position: relative;
  padding: 8px 12px 18px 12px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
  animation: fadeIn 0.2s ease;
  max-width: 75%;
  width: auto;
}

.sent{
  background:#005c4b;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.received{
  background:#202c33;
  color:white;
  border-bottom-left-radius:4px;
}

.meta{
  font-size:10px;
  opacity:.7;
  margin-top:3px;
  text-align:right;
  display:flex;
  justify-content:flex-end;
  gap:4px;
  align-items:center;
}

.check{
  font-size:11px;
}

.chat-input{
  background:#111b21;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
}

.chat-input input{
  flex:1;
  padding:10px 15px;
  border-radius:20px;
  border:none;
  outline:none;
  background:#202c33;
  color:white;
}

.icon-btn{
  background:#00a884;
  border:none;
  color:white;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
  transition:.2s;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#008069;
}

.emoji-panel{
  display:none;
  background:#111b21;
  padding:8px;
  font-size:20px;
  gap:10px;
}

.emoji-panel span{
  cursor:pointer;
  margin:5px;
}

img.chat-img{
  max-width:100%;
  border-radius:10px;
  margin-top:5px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="avatar"></div>
    ZenixStore
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="emoji-panel" id="emojiPanel">
    <span>😂</span>
    <span>❤️</span>
    <span>🔥</span>
    <span>👍</span>
    <span>😎</span>
    <span>😭</span>
    <span>😡</span>
  </div>

  <div class="chat-input">
    <button class="icon-btn" onclick="toggleEmoji()">😊</button>
    <input type="text" id="messageInput" placeholder="Ketik pesan...">
    <input type="file" id="imageInput" accept="image/*" hidden>
    <button class="icon-btn" onclick="openGallery()">📷</button>
    <button class="icon-btn" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const emojiPanel = document.getElementById("emojiPanel");
const imageInput = document.getElementById("imageInput");

function getTime(){
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ":" +
         now.getMinutes().toString().padStart(2,'0');
}

function toggleEmoji(){
  emojiPanel.style.display =
    emojiPanel.style.display === "flex" ? "none" : "flex";
  emojiPanel.style.flexWrap="wrap";
}

emojiPanel.querySelectorAll("span").forEach(e=>{
  e.onclick=()=> messageInput.value += e.textContent;
});

function sendMessage(){
  const text = messageInput.value.trim();
  if(text==="") return;

  const msg = document.createElement("div");
  msg.classList.add("message","sent");
  msg.innerHTML = `
    ${text}
    <div class="meta">
      ${getTime()}
      <span class="check">✓</span>
    </div>
  `;

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
  messageInput.value="";
  emojiPanel.style.display="none";

  setTimeout(()=>{
    msg.querySelector(".check").innerHTML="✓✓";
  },800);

  setTimeout(()=>{
    msg.querySelector(".check").style.color="#4fc3f7";
  },1500);
}

function openGallery(){
  imageInput.click();
}

imageInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    const msg = document.createElement("div");
    msg.classList.add("message","sent");
    msg.innerHTML = `
      <img src="${e.target.result}" class="chat-img">
      <div class="meta">
        ${getTime()}
        <span class="check">✓</span>
      </div>
    `;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(()=>{
      msg.querySelector(".check").innerHTML="✓✓";
    },800);

    setTimeout(()=>{
      msg.querySelector(".check").style.color="#4fc3f7";
    },1500);
  };
  reader.readAsDataURL(file);
});

messageInput.addEventListener("keypress", e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
