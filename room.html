<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Room Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#0f0f0f;
color:white;
}

#chat{
height:400px;
overflow:auto;
border:1px solid #333;
padding:10px;
margin-bottom:10px;
}

input{
width:80%;
padding:10px;
}

button{
padding:10px;
background:#00bfff;
border:none;
color:white;
}

</style>
</head>

<body>

<h2 id="roomTitle"></h2>

<div id="chat"></div>

<input id="msg">

<button onclick="sendMessage()">Send</button>


<script>

const SUPABASE_URL="https://lmpbrrlhacfriuazrtok.supabase.co"

const SUPABASE_KEY="sb_publishable_ZyOAm9p6EXzOZobH-QNvbQ_7F4imDAF"

const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)


const params=new URLSearchParams(window.location.search)

const room=params.get("code")

const name=params.get("name")

document.getElementById("roomTitle").innerText="Room : "+room


// SEND MESSAGE

async function sendMessage(){

const message=document.getElementById("msg").value

await supabase.from("messages").insert([

{
room_code:room,
sender:name,
message:message
}

])

document.getElementById("msg").value=""

}


// REALTIME CHAT

supabase.channel("chat")

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:`room_code=eq.${room}`
},
(payload)=>{

const data=payload.new

const div=document.createElement("div")

div.innerText=data.sender+" : "+data.message

document.getElementById("chat").appendChild(div)

}
)

.subscribe()

</script>

</body>
</html>
